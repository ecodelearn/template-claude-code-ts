name: Feature request / Solicitação de recurso
description: Propose an improvement / Proponha uma melhoria
title: "[Feature] "
labels:
  - enhancement
body:
  - type: dropdown
    id: language
    attributes:
      label: Language / Idioma
      options:
        - English
        - Português do Brasil
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / Problema
      description: What user need is not covered? / Qual necessidade não está coberta?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / Proposta
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / Alternativas
  - type: checkboxes
    id: scope
    attributes:
      label: Scope / Escopo
      options:
        - label: I understand this proposal must preserve secret filtering and transactional rollback.
          required: true
